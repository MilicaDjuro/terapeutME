# Render Free API za početno testiranje; PostgreSQL se zasebno kreira na Neon Free.
# Email je isključen dok se ne podesi SES ili Resend HTTPS dostava prema docs/aws-ses.md i docs/auth.md.
services:
  - type: web
    name: terapeut-api
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm ci --include=dev && npm run build:api
    startCommand: npm run start:render
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: API_HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        # Neon direktna veza sa uključenim TLS-om; Connection pooling mora biti isključen.
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: WEB_ORIGINS
        sync: false
      - key: AUTH_EMAIL_MODE
        value: disabled
      # Daily se uključuje tek kada nalog i tajni serverski ključ budu spremni.
      - key: ONLINE_SESSIONS_PROVIDER
        value: disabled

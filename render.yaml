# Produkcioni predlog koristi plaćene instance zbog SMTP-a, pozadinskih poslova i trajne baze.
# Ovaj fajl sam po sebi ne kreira resurse. Prije primjene provjerite planove u Renderu.
services:
  - type: web
    name: terapeut-api
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: npm ci --include=dev && npm run build:api
    preDeployCommand: node apps/api/dist/migrate.js
    startCommand: npm run start:api
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: API_HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        fromDatabase:
          name: terapeut-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: WEB_ORIGINS
        sync: false
      - key: AUTH_EMAIL_MODE
        value: smtp
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_SECURE
        value: "true"
      - key: SMTP_FROM
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false

databases:
  - name: terapeut-db
    region: frankfurt
    plan: basic-256mb
    databaseName: terapeut
    user: terapeut
    postgresMajorVersion: "16"
    # API koristi internu vezu; javni pristup bazi nije potreban.
    ipAllowList: []
